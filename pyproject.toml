[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portpulse"
version = "0.1.0"
description = "Find out what's using your ports, and free them up."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
portpulse = "portpulse.cli:main"

[tool.setuptools]
packages = ["portpulse"]
